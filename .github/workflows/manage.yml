name: manage portfolio

# Runs a management cycle on live Yahoo Finance data three times each weekday
# session, then commits the updated ledger and report so the portfolio's
# history lives in the repository. GitHub often starts scheduled jobs hours
# late, so several slots keep at least one inside market hours; a run that
# lands outside the session (or gets stale prices) records the report but
# does not trade.
# 15/17/19 UTC = 11:00/13:00/15:00 New York in summer (EDT), 10/12/14 in winter.
on:
  schedule:
    - cron: "0 15,17,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manage-portfolio
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Management cycle
        env:
          # Only used when portfolio/growthpm.toml sets broker = "alpaca".
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          growthpm run --config portfolio/growthpm.toml --execute | tee "$GITHUB_STEP_SUMMARY"
          cp "$(ls -t portfolio/reports/*.md | head -1)" portfolio/LATEST.md
      - name: Commit ledger and report
        run: |
          git config user.name "growthpm bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/ docs/
          git diff --cached --quiet || git commit -m "portfolio: cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
