[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "growthpm"
version = "0.1.0"
description = "Active growth portfolio manager: live market data, momentum signals, fractional-Kelly sizing and opportunity-cost rotation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "yfinance>=0.2.40",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
growthpm = "growthpm.cli:main"

[tool.setuptools.packages.find]
include = ["growthpm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
